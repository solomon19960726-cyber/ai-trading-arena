name: 撮合引擎（雲端）

on:
  # GitHub 排程是「盡力而為」：整點／每 15 分整（:00 :15 :30 :45）全球最塞，最常被延遲或直接丟掉，
  # 所以分鐘錯開到 :07 :22 :37 :52。新 repo 的排程也常延遲數小時才穩定。詳見 README「排程」。
  schedule:
    - cron: '7,22,37,52 8-23 * * 1-5'   # 美東盤前～盤中（UTC）
    - cron: '7,22,37,52 0-2 * * 2-6'    # 美東盤後＋20:05 每日戰報（週五晚＝UTC 週六凌晨）
    - cron: '11 3-7 * * *'              # 夜盤每小時一次（推決策紀錄、讀 Muse/Spark）
  repository_dispatch:
    types: [tick]
  workflow_dispatch:
    inputs:
      chart:
        description: '順便推一張淨值曲線圖到 Discord'
        type: boolean
        default: false
      scan:
        description: '順便跑一次市場掃描（不管時間；盤中跑的不擋晚上收盤後那次）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run:
    if: vars.ENGINE == 'cloud' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 收盤後那次多跑市場掃描（約 1 分鐘）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 撮合＋同步＋產生觀戰網頁
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SPARK_LEDGER_CSV_URL: ${{ secrets.SPARK_LEDGER_CSV_URL }}   # 選用：沒設就是空字串，照舊解析 Discord
        run: python cloud_run.py ${{ inputs.chart && 'chart' || '' }} ${{ inputs.scan && 'scan' || '' }}
      - name: 把結果存回 repo
        run: |
          git config user.name "arena-engine"
          git config user.email "arena-engine@users.noreply.github.com"
          git add -A data orders docs
          git diff --cached --quiet && exit 0
          git commit -m "引擎 $(TZ=America/New_York date '+%m/%d %H:%M') ET" -q
          for i in 1 2 3 4 5; do
            git pull --rebase -q -X theirs && git push -q && exit 0
            sleep 5
          done
          exit 1
